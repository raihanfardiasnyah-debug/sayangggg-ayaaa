<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2 Bulan Kita 🎀</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap');

  :root{
    --bg:#140a10;
    --pink:#f2a3c0;
    --pink-soft:#ffd1e3;
    --pink-deep:#e37ba3;
    --gold:#f0c89c;
    --white:#fff5f8;
    --dim:#c79aae;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    height:100dvh;
    background:var(--bg);
    color:var(--white);
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    position:fixed;
    width:100%;
  }

  .screen{
    position:fixed;
    inset:0;
    height:100%;
    height:100dvh;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(242,163,192,0.16), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(255,209,227,0.12), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(227,123,163,0.06), transparent 60%),
      var(--bg);
    text-align:center;
    padding:24px;
  }
  .screen.active{display:flex;}

  /* ---------- ambience ---------- */
  .ambience{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .petal{
    position:absolute;top:-5%;font-size:18px;opacity:0.65;
    animation:fall linear infinite;
    filter:drop-shadow(0 0 4px rgba(242,163,192,0.45));
  }
  @keyframes fall{
    0%{transform:translateY(-10vh) translateX(0) rotate(0deg);opacity:0;}
    10%{opacity:0.7;}
    90%{opacity:0.5;}
    100%{transform:translateY(110vh) translateX(40px) rotate(360deg);opacity:0;}
  }
  .butterfly{
    position:absolute;font-size:19px;animation:flutter 9s ease-in-out infinite;opacity:0.75;
  }
  @keyframes flutter{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(30px,-40px) rotate(10deg);}
    50%{transform:translate(60px,10px) rotate(-8deg);}
    75%{transform:translate(20px,50px) rotate(6deg);}
  }
  .sparkle{
    position:absolute;color:var(--pink-soft);font-size:13px;
    animation:twinkle 2.4s ease-in-out infinite;z-index:1;
  }
  @keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.8);}50%{opacity:1;transform:scale(1.25);}}

  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1px;}

  /* ---------- SCREEN 0 : HOME ---------- */
  #screen-entry .frame-line{
    position:absolute;inset:16px;
    border:1.5px dashed rgba(242,163,192,0.28);
    border-radius:18px;
    pointer-events:none;z-index:1;
  }
  #screen-entry .eyebrow{
    font-size:11px;letter-spacing:5px;text-transform:uppercase;
    color:var(--pink-soft);opacity:0.9;margin-bottom:10px;z-index:2;
  }
  #screen-entry h1{
    font-family:'Caveat',cursive;
    font-size:clamp(40px,12vw,58px);
    color:var(--white);
    margin-bottom:4px;
    font-weight:700;
    z-index:2;
  }
  #screen-entry .subtitle{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-size:15px;color:var(--dim);
    margin-bottom:18px;max-width:280px;line-height:1.6;z-index:2;
  }
  .bouquet-home{position:relative;width:270px;height:200px;margin-bottom:12px;z-index:2;}
  .bloom{
    position:absolute;font-size:36px;transform-origin:center bottom;
    animation:bloomIn 1s cubic-bezier(.3,1.5,.4,1) backwards, sway 4s ease-in-out infinite;
    filter:drop-shadow(0 0 10px rgba(242,163,192,0.4));
  }
  @keyframes bloomIn{0%{transform:scale(0) rotate(0deg);opacity:0;}100%{transform:scale(1) rotate(var(--rot,0deg));opacity:1;}}
  @keyframes sway{0%,100%{transform:rotate(var(--rot,0deg)) translateY(0);}50%{transform:rotate(calc(var(--rot,0deg) + 3deg)) translateY(-4px);}}
  .enter-btn{
    margin-top:4px;padding:12px 32px;
    background:linear-gradient(135deg, var(--pink-deep), var(--pink));
    border:none;color:#2a0f1a;border-radius:30px;
    font-size:13px;font-weight:600;letter-spacing:1px;
    cursor:pointer;transition:all .3s;z-index:2;
    box-shadow:0 6px 24px rgba(227,123,163,0.4);
    animation:btnPulse 2.4s ease-in-out infinite;
  }
  .enter-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(227,123,163,0.55);}
  @keyframes btnPulse{0%,100%{box-shadow:0 6px 24px rgba(227,123,163,0.4);}50%{box-shadow:0 6px 30px rgba(227,123,163,0.65);}}
  #screen-entry .deco-row{margin-top:20px;font-size:15px;letter-spacing:8px;color:var(--pink-soft);opacity:0.6;z-index:2;}

  /* ---------- SCREEN 1 : LETTER ---------- */
  #screen-letter{align-items:center;justify-content:center;padding:16px;}
  .letter-box{
    position:relative;
    max-width:560px;max-height:70dvh;overflow-y:auto;z-index:2;
    padding:32px 24px 26px;
    border:1.5px solid rgba(242,163,192,0.3);
    border-radius:16px;
    background:linear-gradient(180deg, rgba(255,209,227,0.05), rgba(255,255,255,0.02));
    backdrop-filter:blur(3px);
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
  }
  .letter-box::before{
    content:"";
    position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);
    width:70px;height:22px;
    background:rgba(255,209,227,0.18);
    border:1px solid rgba(255,209,227,0.3);
    border-radius:2px;
  }
  .letter-box::-webkit-scrollbar{width:4px;}
  .letter-box::-webkit-scrollbar-thumb{background:rgba(242,163,192,0.4);border-radius:4px;}
  .letter-box .deco{font-size:20px;color:var(--pink);margin-bottom:12px;}
  .letter-box p{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(15px,4vw,18px);line-height:1.8;
    color:var(--white);font-style:italic;white-space:pre-line;text-align:left;
  }
  .letter-box .signoff{margin-top:18px;font-size:22px;color:var(--gold);letter-spacing:1px;}
  .vent-note{
    margin-top:20px;padding:14px 16px;
    border:1px dashed rgba(242,163,192,0.4);
    border-radius:12px;
    background:rgba(242,163,192,0.06);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-size:14px;color:var(--pink-soft);line-height:1.6;text-align:left;
  }
  .next-btn{
    margin-top:18px;padding:10px 30px;
    background:linear-gradient(135deg, var(--pink-deep), var(--pink));
    border:none;color:#2a0f1a;border-radius:30px;
    font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;transition:all .3s;z-index:2;
    box-shadow:0 6px 20px rgba(227,123,163,0.35);
  }
  .next-btn:hover{transform:translateY(-2px);}

  /* ---------- SCREEN 2 : FINAL ---------- */
  #screen-final{position:relative;}
  .glow-orb{
    position:absolute;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle, rgba(242,163,192,0.32) 0%, rgba(255,209,227,0.14) 45%, transparent 70%);
    filter:blur(10px);animation:orbPulse 3.5s ease-in-out infinite;z-index:0;
  }
  @keyframes orbPulse{0%,100%{transform:scale(1);opacity:0.7;}50%{transform:scale(1.25);opacity:1;}}
  .final-stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
  .love-text{
    font-family:'Caveat', cursive;
    font-size:clamp(46px, 17vw, 102px);
    font-weight:700;
    line-height:1.1;
    background:linear-gradient(120deg, var(--pink), var(--gold), var(--pink-soft), var(--pink));
    background-size:300% 300%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 4s ease-in-out infinite, popIn 1.4s cubic-bezier(.2,1.4,.4,1) both;
    text-shadow:0 0 60px rgba(242,163,192,0.35);
    text-align:center;max-width:90vw;padding:0 10px;
  }
  .love-text .beat{font-size:0.5em;vertical-align:-0.05em;display:inline-block;animation:heartbeat 1.4s ease-in-out infinite;}
  @keyframes shimmer{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
  @keyframes popIn{
    0%{transform:scale(0.3) rotate(-4deg);opacity:0;}
    55%{transform:scale(1.12) rotate(1deg);opacity:1;}
    75%{transform:scale(0.96) rotate(0deg);}
    100%{transform:scale(1);}
  }
  @keyframes heartbeat{0%,100%{transform:scale(1);}15%{transform:scale(1.2);}30%{transform:scale(1);}45%{transform:scale(1.15);}60%{transform:scale(1);}}
  #screen-final .tiny{
    margin-top:18px;color:var(--dim);font-size:15px;letter-spacing:1.5px;
    font-family:'Cormorant Garamond',serif;font-style:italic;
    animation:fadeUp 1.6s ease-out 0.8s both;max-width:300px;line-height:1.6;
  }
  @keyframes fadeUp{0%{opacity:0;transform:translateY(14px);}100%{opacity:1;transform:translateY(0);}}
  .restart-btn{
    margin-top:30px;padding:10px 26px;background:transparent;
    border:1.5px solid var(--pink-soft);color:var(--pink-soft);border-radius:30px;
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    cursor:pointer;transition:all .3s;animation:fadeUp 1.6s ease-out 1.2s both;
  }
  .restart-btn:hover{background:var(--pink-soft);color:#2a0f1a;}
  .rising-heart{position:absolute;bottom:-10%;font-size:16px;opacity:0;animation:rise linear infinite;z-index:1;}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) scale(0.8);opacity:0;}
    12%{opacity:0.85;}88%{opacity:0.6;}
    100%{transform:translateY(-115vh) translateX(var(--drift,20px)) scale(1.1);opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){*{animation:none !important;}}
</style>
</head>
<body>

<div class="ambience" id="ambience"></div>

<!-- SCREEN 0: HOME -->
<div class="screen active" id="screen-entry">
  <div class="frame-line"></div>
  <div class="eyebrow">2 bulan bersama</div>
  <h1>Hai, Sayang</h1>
  <p class="subtitle">ada kata-kata kecil yang ingin aku sampaikan untuk merayakan kita</p>
  <div class="bouquet-home" id="bouquetHome"></div>
  <button class="enter-btn" onclick="goTo('screen-letter')">💗 buka surat cinta</button>
  <div class="deco-row">🌸 💗 🌸</div>
</div>

<!-- SCREEN 1: LETTER -->
<div class="screen" id="screen-letter">
  <div style="display:flex;flex-direction:column;align-items:center;max-height:100%;">
    <div class="letter-box">
      <div class="deco">🎀 ✧ 🎀</div>
      <p id="letterText"></p>
      <div class="signoff">Happy 2 bulan, sayang. 🎀</div>
          </div>
    <button class="next-btn" onclick="goTo('screen-final')">continue →</button>
  </div>
</div>

<!-- SCREEN 2: FINAL -->
<div class="screen" id="screen-final">
  <div class="glow-orb"></div>
  <div class="final-stage">
    <div class="love-text">2 Bulan Kita <span class="beat">🎀</span></div>
    <div class="tiny">terima kasih sudah memaafkan dan tetap bertahan, aku sayang kamu</div>
    <button class="restart-btn" onclick="goTo('screen-entry')">↺ replay</button>
  </div>
</div>

<script>
const letterContent = `Sayang, gak terasa ya, sudah 2 bulan kita menjalani hubungan ini bersama.

Dua bulan yang isinya bukan cuma manis dan bahagia aja, tapi juga ada masa-masa aku bikin kamu kecewa. Aku sadar, selama ini aku belum jadi pasangan yang sempurna. Ada kalanya aku khilaf, ada kalanya sikap atau kata-kata aku bikin hati kamu sakit. Tapi di setiap kesalahan itu, kamu selalu memilih untuk tetap tinggal, tetap memaafkan, dan tetap percaya sama aku.

Terima kasih ya, sayang. Terima kasih sudah sabar menghadapi aku yang masih banyak belajar. Terima kasih sudah memilih untuk memaafkan, bukan pergi, meskipun aku tahu itu gak selalu mudah buat kamu. Maaf karena banyak mengecewakan kamu, dan terima kasih karena tetap bertahan di sisi aku sampai hari ini.

Dua bulan ini ngajarin aku banyak hal, terutama soal gimana caranya mencintai dengan lebih baik, lebih sabar, dan lebih menghargai kamu. Kamu bukan cuma pacar aku, tapi juga orang yang bikin aku pengen jadi versi terbaik dari diri aku sendiri.

Terima kasih juga ya, sayang, karena selama ini sudah mau menerima aku apa adanya. Dengan segala kekurangan, sikapku yang kadang masih belum dewasa, kamu tetap mau bersama aku dan gak pernah menuntut aku buat jadi orang lain. Itu artinya besar banget buat aku.

Aku juga mau minta maaf atas semua kesalahan aku selama ini, baik yang sengaja maupun yang gak sengaja bikin kamu kecewa atau terluka. Aku janji, aku akan berusaha untuk tidak mengulanginya lagi. Bukan cuma janji di mulut, tapi aku akan benar-benar berusaha membuktikannya lewat sikap aku ke depannya.

Aku janji, mulai dari sini, aku akan lebih berusaha. Lebih jaga perasaan kamu, lebih dengerin kamu, dan lebih berusaha supaya kekecewaan yang kemarin-kemarin gak terulang lagi. Aku mau 2 bulan ini jadi awal dari banyak bulan dan tahun lainnya yang kita lewati bersama.

Terima kasih sudah ada, sayang. Terima kasih sudah bertahan, sudah memaafkan, dan sudah menerima aku apa adanya. Aku sayang kamu, hari ini, dan di setiap hari yang akan datang.`;

document.getElementById('letterText').textContent = letterContent;

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'screen-final') buildRisingHearts();
}

function buildRisingHearts(){
  const screen = document.getElementById('screen-final');
  if(screen.dataset.built) return;
  screen.dataset.built = "1";
  const emojis = ['🌸','💗','🎀','✦'];
  for(let i=0;i<14;i++){
    const h = document.createElement('div');
    h.className = 'rising-heart';
    h.textContent = emojis[i % emojis.length];
    h.style.left = Math.random()*100 + '%';
    h.style.setProperty('--drift', (Math.random()*80 - 40) + 'px');
    h.style.animationDuration = (6 + Math.random()*6) + 's';
    h.style.animationDelay = (Math.random()*7) + 's';
    h.style.fontSize = (12 + Math.random()*11) + 'px';
    screen.appendChild(h);
  }
}

/* pink bouquet on home screen */
const bouquetEmojis = ['🌸','🌷','🌺','💮','🎀'];
const bqHome = document.getElementById('bouquetHome');
const positions = [
  {x:115,y:70,rot:-8,delay:0.05,size:36},
  {x:78,y:98,rot:-18,delay:0.15,size:28},
  {x:155,y:98,rot:16,delay:0.25,size:28},
  {x:50,y:125,rot:-26,delay:0.35,size:26},
  {x:180,y:125,rot:24,delay:0.45,size:26},
  {x:98,y:50,rot:-4,delay:0.55,size:28},
  {x:135,y:50,rot:6,delay:0.65,size:28},
  {x:115,y:115,rot:2,delay:0.75,size:32},
  {x:62,y:70,rot:-14,delay:0.85,size:22},
];
positions.forEach((p,idx)=>{
  const f = document.createElement('div');
  f.className = 'bloom';
  f.textContent = bouquetEmojis[idx % bouquetEmojis.length];
  f.style.left = p.x + 'px';
  f.style.top = p.y + 'px';
  f.style.setProperty('--rot', p.rot + 'deg');
  f.style.animationDelay = p.delay + 's, ' + (1 + p.delay) + 's';
  f.style.fontSize = p.size + 'px';
  bqHome.appendChild(f);
});

/* ambient petals + butterflies + sparkles */
const ambience = document.getElementById('ambience');
const petalEmojis = ['🌸','🌺','🌷','💮','🎀'];
for(let i=0;i<16;i++){
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = petalEmojis[i % petalEmojis.length];
  p.style.left = Math.random()*100 + 'vw';
  p.style.animationDuration = (8 + Math.random()*10) + 's';
  p.style.animationDelay = (Math.random()*10) + 's';
  p.style.fontSize = (12 + Math.random()*14) + 'px';
  ambience.appendChild(p);
}
for(let i=0;i<5;i++){
  const b = document.createElement('div');
  b.className = 'butterfly';
  b.textContent = '🦋';
  b.style.left = (5 + Math.random()*90) + 'vw';
  b.style.top = (10 + Math.random()*80) + 'vh';
  b.style.animationDuration = (7 + Math.random()*5) + 's';
  b.style.animationDelay = (Math.random()*4) + 's';
  ambience.appendChild(b);
}
for(let i=0;i<20;i++){
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.textContent = '✦';
  s.style.left = Math.random()*100 + 'vw';
  s.style.top = Math.random()*100 + 'vh';
  s.style.animationDelay = (Math.random()*3) + 's';
  ambience.appendChild(s);
}
</script>
</body>
</html>
