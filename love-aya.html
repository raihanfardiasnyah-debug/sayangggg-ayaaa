<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Untukmu, Sayang 🌸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap');

  :root{
    --bg:#0a0a0c;
    --pink:#e8a3bb;
    --pink-soft:#f3c9d8;
    --gold:#d4af8c;
    --white:#f5f0eb;
    --dim:#9a8f96;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    height:100dvh;
    background:var(--bg);
    color:var(--white);
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    position:fixed;
    width:100%;
  }

  .screen{
    position:fixed;
    inset:0;
    height:100%;
    height:100dvh;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    overflow:hidden;
    background:
      radial-gradient(circle at 25% 20%, rgba(232,163,187,0.10), transparent 45%),
      radial-gradient(circle at 75% 80%, rgba(243,201,216,0.08), transparent 45%),
      var(--bg);
    text-align:center;
    padding:24px;
  }
  .screen.active{display:flex;}

  /* ---------- ambience: pink petals + butterflies ---------- */
  .ambience{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .petal{
    position:absolute;
    top:-5%;
    font-size:18px;
    opacity:0.6;
    animation:fall linear infinite;
