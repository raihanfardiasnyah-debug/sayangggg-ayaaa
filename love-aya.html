<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Aya 🤍</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap');

  :root{
    --bg:#0a0a0c;
    --bg2:#111114;
    --gold:#d4af8c;
    --rose:#c98a9c;
    --lilac:#b9a3d6;
    --white:#f5f0eb;
    --dim:#8a8590;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    height:100dvh;
    background:var(--bg);
    color:var(--white);
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    position:fixed;
    width:100%;
  }

  .screen{
    position:fixed;
    inset:0;
    height:100%;
    height:100dvh;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(185,163,214,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(201,138,156,0.08), transparent 40%),
      var(--bg);
    text-align:center;
    padding:24px;
  }
  .screen.active{display:flex;}

  /* ---------- floating petals & butterflies (global ambience) ---------- */
  .ambience{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .petal{
    position:absolute;
    top:-5%;
    font-size:18px;
    opacity:0.55;
    animation:fall linear infinite;
    filter:drop-shadow(0 0 4px rgba(201,138,156,0.4));
  }
  @keyframes fall{
    0%{transform:translateY(-10vh) translateX(0) rotate(0deg);opacity:0;}
    10%{opacity:0.6;}
    90%{opacity:0.5;}
    100%{transform:translateY(110vh) translateX(40px) rotate(360deg);opacity:0;}
  }
  .butterfly{
    position:absolute;
    font-size:20px;
    animation:flutter 9s ease-in-out infinite;
    opacity:0.7;
  }
  @keyframes flutter{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(30px,-40px) rotate(10deg);}
    50%{transform:translate(60px,10px) rotate(-8deg);}
    75%{transform:translate(20px,50px) rotate(6deg);}
  }

  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1px;}

  /* ---------- SCREEN 0 : QR ENTRY ---------- */
  #screen-entry{
    padding:30px 24px;
  }
  #screen-entry .frame-line{
    position:absolute;
    inset:18px;
    border:1px solid rgba(212,175,140,0.18);
    pointer-events:none;
    z-index:1;
  }
  #screen-entry .eyebrow{
    font-size:11px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:var(--gold);
    opacity:0.85;
    margin-bottom:10px;
    z-index:2;
  }
  #screen-entry h1{
    font-size:clamp(26px,7vw,36px);
    color:var(--white);
    margin-bottom:6px;
    letter-spacing:1px;
    font-family:'Great Vibes',cursive;
    font-weight:400;
    z-index:2;
  }
  #screen-entry .subtitle{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    color:var(--dim);
    margin-bottom:34px;
    max-width:280px;
    line-height:1.6;
    z-index:2;
  }
  #screen-entry .qr-wrap{
    position:relative;
    width:210px;
    height:210px;
    cursor:pointer;
    z-index:2;
    margin-bottom:22px;
  }
  .qr-ring{
    position:absolute;
    inset:-16px;
    border:1px dashed rgba(212,175,140,0.4);
    border-radius:50%;
    animation:spinSlow 18s linear infinite;
  }
  @keyframes spinSlow{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  .heart-clip{
    width:210px;
    height:210px;
    clip-path: path('M105 190 C19 133 -10 76 29 43 C55 19 90 29 105 57 C120 29 155 19 181 43 C220 76 191 133 105 190 Z');
    background:
      repeating-linear-gradient(0deg, var(--gold) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(90deg, var(--gold) 0 6px, transparent 6px 12px);
    background-blend-mode:screen;
    background-color:#1a1a1e;
    box-shadow:0 0 45px rgba(212,175,140,0.4);
    animation:pulseHeart 2.4s ease-in-out infinite;
  }
  @keyframes pulseHeart{
    0%,100%{transform:scale(1);filter:brightness(1);}
    50%{transform:scale(1.05);filter:brightness(1.25);}
  }
  #screen-entry p.hint{
    color:var(--dim);
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    z-index:2;
    animation:hintPulse 2s ease-in-out infinite;
  }
  @keyframes hintPulse{
    0%,100%{opacity:0.5;}
    50%{opacity:1;}
  }
  #screen-entry .deco-row{
    margin-top:26px;
    font-size:15px;
    letter-spacing:10px;
    color:var(--rose);
    opacity:0.6;
    z-index:2;
  }

  /* ---------- SCREEN 1 : BOUQUET + PASSCODE ---------- */
  .bouquet{
    position:relative;
    width:260px;
    height:260px;
    margin-bottom:10px;
    z-index:2;
  }
  .bouquet .stem{
    position:absolute;
    bottom:0;left:50%;
    width:3px;height:70px;
    background:linear-gradient(#3a5a40,#243c28);
    transform:translateX(-50%);
  }
  .flower{
    position:absolute;
    font-size:34px;
    transform-origin:center bottom;
    animation:bloom 1.1s cubic-bezier(.3,1.5,.4,1) backwards, sway 4s ease-in-out infinite;
  }
  @keyframes bloom{
    0%{transform:scale(0) rotate(0deg);opacity:0;}
    100%{transform:scale(1) rotate(var(--rot,0deg));opacity:1;}
  }
  @keyframes sway{
    0%,100%{transform:rotate(var(--rot,0deg)) translateY(0);}
    50%{transform:rotate(calc(var(--rot,0deg) + 3deg)) translateY(-4px);}
  }

  #screen-code h2{
    font-size:26px;
    color:var(--white);
    margin:14px 0 6px;
  }
  #screen-code .sub{
    color:var(--dim);
    font-size:13px;
    margin-bottom:22px;
    letter-spacing:1px;
  }
  .code-boxes{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    z-index:2;
  }
  .code-boxes input{
    width:38px;height:48px;
    text-align:center;
    font-size:22px;
    color:var(--white);
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(212,175,140,0.4);
    border-radius:8px;
    outline:none;
    font-family:'Poppins',sans-serif;
    transition:border-color .2s, box-shadow .2s;
  }
  .code-boxes input:focus{
    border-color:var(--rose);
    box-shadow:0 0 12px rgba(201,138,156,0.5);
  }
  #code-error{
    color:var(--rose);
    font-size:12px;
    height:16px;
    margin-bottom:10px;
    opacity:0;
    transition:opacity .2s;
  }
  #code-error.show{opacity:1;}
  .enter-btn{
    margin-top:6px;
    padding:10px 28px;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:30px;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .3s;
  }
  .enter-btn:hover{background:var(--gold);color:#0a0a0c;}

  /* ---------- SCREEN 2 : LETTER ---------- */
  #screen-letter{
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .letter-box{
    max-width:560px;
    max-height:66dvh;
    overflow-y:auto;
    z-index:2;
    padding:30px 24px;
    border:1px solid rgba(212,175,140,0.25);
    border-radius:6px;
    background:rgba(255,255,255,0.02);
    backdrop-filter:blur(2px);
  }
  .letter-box::-webkit-scrollbar{width:4px;}
  .letter-box::-webkit-scrollbar-thumb{background:rgba(212,175,140,0.35);border-radius:4px;}
  .letter-box .deco{
    font-size:20px;
    color:var(--rose);
    margin-bottom:12px;
  }
  .letter-box p{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(15px, 4vw, 18px);
    line-height:1.75;
    color:var(--white);
    font-style:italic;
    white-space:pre-line;
    text-align:left;
  }
  .letter-box .signoff{
    margin-top:18px;
    font-size:22px;
    color:var(--gold);
    letter-spacing:1px;
  }
  .next-btn{
    margin-top:18px;
    padding:9px 28px;
    background:transparent;
    border:1px solid var(--rose);
    color:var(--rose);
    border-radius:30px;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .3s;
    z-index:2;
  }
  .next-btn:hover{background:var(--rose);color:#0a0a0c;}

  /* ---------- SCREEN 3 : I LOVE YOU ---------- */
  #screen-final{
    position:relative;
    overflow:hidden;
  }
  .glow-orb{
    position:absolute;
    width:480px;height:480px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(201,138,156,0.35) 0%, rgba(185,163,214,0.15) 45%, transparent 70%);
    filter:blur(10px);
    animation:orbPulse 3.5s ease-in-out infinite;
    z-index:0;
  }
  @keyframes orbPulse{
    0%,100%{transform:scale(1);opacity:0.7;}
    50%{transform:scale(1.25);opacity:1;}
  }
  .final-stage{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .love-text{
    font-family:'Great Vibes', cursive;
    font-size:clamp(44px, 16vw, 100px);
    line-height:1.15;
    background:linear-gradient(120deg, var(--rose), var(--gold), var(--lilac), var(--rose));
    background-size:300% 300%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shimmer 4s ease-in-out infinite, popIn 1.4s cubic-bezier(.2,1.4,.4,1) both;
    text-shadow:0 0 60px rgba(201,138,156,0.3);
    text-align:center;
    max-width:90vw;
    padding:0 10px;
  }
  .love-text .beat{
    font-size:0.55em;
    vertical-align:-0.05em;
  }
  @keyframes shimmer{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  @keyframes popIn{
    0%{transform:scale(0.3) rotate(-4deg);opacity:0;}
    55%{transform:scale(1.12) rotate(1deg);opacity:1;}
    75%{transform:scale(0.96) rotate(0deg);}
    100%{transform:scale(1);}
  }
  #screen-final .beat{
    animation:heartbeat 1.4s ease-in-out infinite;
    display:inline-block;
    filter:drop-shadow(0 0 18px rgba(201,138,156,0.6));
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1);}
    15%{transform:scale(1.2);}
    30%{transform:scale(1);}
    45%{transform:scale(1.15);}
    60%{transform:scale(1);}
  }
  #screen-final .tiny{
    margin-top:22px;
    color:var(--dim);
    font-size:15px;
    letter-spacing:3px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    animation:fadeUp 1.6s ease-out 0.8s both;
  }
  @keyframes fadeUp{
    0%{opacity:0;transform:translateY(14px);}
    100%{opacity:1;transform:translateY(0);}
  }
  .restart-btn{
    margin-top:34px;
    padding:9px 26px;
    background:transparent;
    border:1px solid var(--lilac);
    color:var(--lilac);
    border-radius:30px;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .3s;
    animation:fadeUp 1.6s ease-out 1.2s both;
  }
  .restart-btn:hover{background:var(--lilac);color:#0a0a0c;}

  .rising-heart{
    position:absolute;
    bottom:-10%;
    font-size:16px;
    opacity:0;
    animation:rise linear infinite;
    z-index:1;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) scale(0.8);opacity:0;}
    12%{opacity:0.85;}
    88%{opacity:0.6;}
    100%{transform:translateY(-115vh) translateX(var(--drift,20px)) scale(1.1);opacity:0;}
  }

  .sparkle{
    position:absolute;
    color:var(--gold);
    font-size:14px;
    animation:twinkle 2.4s ease-in-out infinite;
    z-index:1;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.2;transform:scale(0.8);}
    50%{opacity:1;transform:scale(1.2);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
  }
</style>
</head>
<body>

<div class="ambience" id="ambience"></div>

<!-- SCREEN 0: QR ENTRY -->
<div class="screen active" id="screen-entry">
  <div class="frame-line"></div>
  <div class="eyebrow">a little something</div>
  <h1>Love Aya</h1>
  <p class="subtitle">satu kejutan kecil menantimu di balik hati ini</p>
  <div class="qr-wrap" onclick="goTo('screen-letter')">
    <div class="qr-ring"></div>
    <div class="heart-clip"></div>
  </div>
  <p class="hint">tap the heart to open</p>
  <div class="deco-row">🤍 ✧ 🤍</div>
</div>


<!-- SCREEN 2: LETTER -->
<div class="screen" id="screen-letter">
  <div style="display:flex;flex-direction:column;align-items:center;max-height:100%;">
    <div class="letter-box">
      <div class="deco">🤍 ✧ 🤍</div>
      <p id="letterText"></p>
      <div class="signoff">Maafin aku ya, sayang. 🤍</div>
    </div>
    <button class="next-btn" onclick="goTo('screen-final')">continue →</button>
  </div>
</div>

<!-- SCREEN 3: I LOVE YOU -->
<div class="screen" id="screen-final">
  <div class="glow-orb"></div>
  <div class="final-stage">
    <div class="love-text">I Love You <span class="beat">🤍</span></div>
    <div class="tiny">makasih udah mau ngerti, aku sayang kamu</div>
    <button class="restart-btn" onclick="goTo('screen-entry')">↺ replay</button>
  </div>
</div>

<script>
/* ============ CONFIG ============ */
/* Ganti kode rahasia di bawah ini (6 digit angka) sesuai keinginanmu */
const SECRET_CODE = "123456";

const letterContent = `Sayang, aku minta maaf ya.

Tadi aku niatnya mau bales chat kamu di WA, tapi pas mau buka, tiba-tiba muncul notif kalau penyimpanan Google-ku penuh. Karena bingung dan buru-buru, aku jadi hapusin beberapa data dulu biar bisa lanjut pakai HP-nya, dan itu bikin aku telat bales chat kamu. Aku tahu itu bikin kamu nunggu dan akhirnya kamu jadi marah, dan aku ngerti banget kenapa kamu kesal.

Bukan maksud aku buat cuekin kamu, sayang. Sama sekali bukan itu. Aku cuma lagi coba beresin masalah teknis di HP-ku, tapi aku sadar seharusnya aku kasih tahu kamu dulu daripada bikin kamu nunggu tanpa penjelasan. Itu salah aku, dan aku minta maaf soal itu.

Aku tahu rasanya gak enak nunggu balesan tanpa tahu alasannya, apalagi kalau ujung-ujungnya bikin salah paham. Aku gak mau hal kecil kayak gini jadi ganjalan di antara kita. Kamu penting banget buat aku, dan aku gak mau kamu ngerasa diabaikan, walaupun itu gak pernah jadi niat aku.

Maafin aku ya, sayang. Lain kali aku janji akan kasih kabar dulu kalau ada kendala, biar kamu gak salah paham dan gak perlu nunggu dengan perasaan gak enak. Aku sayang kamu, dan aku gak suka lihat kamu marah karena aku.`;

document.getElementById('letterText').textContent = letterContent;

/* ============ SCREEN NAV ============ */
function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'screen-final') buildRisingHearts();
}

/* ============ RISING HEARTS ON FINAL SCREEN ============ */
function buildRisingHearts(){
  const screen = document.getElementById('screen-final');
  if(screen.dataset.built) return;
  screen.dataset.built = "1";
  const heartEmojis = ['🤍','💗','✦'];
  for(let i=0;i<12;i++){
    const h = document.createElement('div');
    h.className = 'rising-heart';
    h.textContent = heartEmojis[i % heartEmojis.length];
    h.style.left = Math.random()*100 + '%';
    h.style.setProperty('--drift', (Math.random()*80 - 40) + 'px');
    h.style.animationDuration = (6 + Math.random()*6) + 's';
    h.style.animationDelay = (Math.random()*7) + 's';
    h.style.fontSize = (12 + Math.random()*10) + 'px';
    screen.appendChild(h);
  }
}

/* ============ AMBIENT PETALS + BUTTERFLIES ============ */
const ambience = document.getElementById('ambience');
const petalEmojis = ['🌸','🌺','🌷','💮'];
for(let i=0;i<14;i++){
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = petalEmojis[i % petalEmojis.length];
  p.style.left = Math.random()*100 + 'vw';
  p.style.animationDuration = (8 + Math.random()*10) + 's';
  p.style.animationDelay = (Math.random()*10) + 's';
  p.style.fontSize = (12 + Math.random()*14) + 'px';
  ambience.appendChild(p);
}
for(let i=0;i<5;i++){
  const b = document.createElement('div');
  b.className = 'butterfly';
  b.textContent = '🦋';
  b.style.left = (5 + Math.random()*90) + 'vw';
  b.style.top = (10 + Math.random()*80) + 'vh';
  b.style.animationDuration = (7 + Math.random()*5) + 's';
  b.style.animationDelay = (Math.random()*4) + 's';
  ambience.appendChild(b);
}
for(let i=0;i<20;i++){
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.textContent = '✦';
  s.style.left = Math.random()*100 + 'vw';
  s.style.top = Math.random()*100 + 'vh';
  s.style.animationDelay = (Math.random()*3) + 's';
  ambience.appendChild(s);
}
</script>
</body>
</html>
